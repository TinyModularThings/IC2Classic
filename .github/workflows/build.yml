name: Build IC2Classic

on:
  push:
    branches: [ '1.20.1' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Refresh dependencies and generate runs
        run: ./gradlew --no-daemon --refresh-dependencies genIntelliJRuns prepareRuns

      - name: Build
        run: ./gradlew --no-daemon build --stacktrace

      - name: Upload artifacts
		uses: actions/upload-artifact@v4
    	with:
          name: ic2classic-jar
          path: build/libs/*.jar
